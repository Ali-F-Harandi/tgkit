[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgkit"
version = "0.3.0"
description = "Unified Telegram toolkit: scan, copy, forward, vault, library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ali-F-Harandi"}
]
keywords = ["telegram", "pyrogram", "bot", "vault", "scanner", "forwarder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyrofork>=2.3.0",
    "tgcrypto>=1.2.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
tui = ["textual>=0.40.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
tgkit = "tgkit.cli:main"

[project.urls]
Homepage = "https://github.com/Ali-F-Harandi/tgkit"
Repository = "https://github.com/Ali-F-Harandi/tgkit"

[tool.hatch.build.targets.wheel]
packages = ["src/tgkit"]

[tool.hatch.build.targets.sdist]
include = ["src/tgkit", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
